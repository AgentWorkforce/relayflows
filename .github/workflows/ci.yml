name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build primitives
        run: npm run build:primitives

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck
